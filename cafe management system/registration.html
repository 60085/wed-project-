<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
    <style>
         body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('../assest/main.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff9d00;
        }
         a {
    display: block;
    text-align: right;
    margin-top: 10px;
    padding: 10px;
    /* background-color: #27ae60; */
    color: rgb(0, 0, 0);
    text-decoration: none;
    border-radius: 5px;
}
    </style>
</head>
<body>
    <div class="container">
        <h2>Registration</h2>
        <!-- added onsubmit to run validation before submitting -->
        <form action="registration.php" method="POST" onsubmit="return validateForm()">
            <!-- kept names same as your original -->
            <input type="text" id="username" name="username" placeholder="Enter Username" required>
            <!-- you had type="text" for password in original; using type="password" is better UX but if you prefer text, change back -->
            <input type="password" id="password" name="password" placeholder="Enter Password" required>
            <button type="submit" name="registration">Register</button>
             <a href="login.html">Login</a>
        </form>
    </div>

    
</body>
</html>
